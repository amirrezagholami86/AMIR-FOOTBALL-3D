<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x829db1);
scene.fog=new THREE.Fog(0x829db1,100,210);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xdcecff,0x30452c,2));

const sun=new THREE.DirectionalLight(0xfff1d6,2.5);
sun.position.set(-35,65,25);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-65;
sun.shadow.camera.right=65;
sun.shadow.camera.top=65;
sun.shadow.camera.bottom=-65;
scene.add(sun);

const stadiumLights=[];
for(let x of [-48,48]){
 for(let z of [-37,37]){
  const pole=new THREE.Mesh(
   new THREE.CylinderGeometry(.28,.5,24,10),
   new THREE.MeshStandardMaterial({color:0x38434b,metalness:.7,roughness:.4})
  );
  pole.position.set(x,12,z);
  scene.add(pole);

  const lamp=new THREE.Mesh(
   new THREE.BoxGeometry(5,1,1.5),
   new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xffffff,emissiveIntensity:1.8})
  );
  lamp.position.set(x,24,z);
  scene.add(lamp);

  const light=new THREE.PointLight(0xffffff,100,75);
  light.position.set(x,22,z);
  scene.add(light);
  stadiumLights.push(light);
 }
}

// TEXTURES
function grassTexture(){
 const c=document.createElement('canvas');
 c.width=1024;c.height=1024;
 const ctx=c.getContext('2d');
 for(let i=0;i<16;i++){
  ctx.fillStyle=i%2?'#247b38':'#318b40';
  ctx.fillRect(0,i*64,1024,64);
 }
 for(let i=0;i<14000;i++){
  const x=Math.random()*1024,y=Math.random()*1024;
  ctx.fillStyle=Math.random()>.5?'#ffffff0a':'#001d0010';
  ctx.fillRect(x,y,2,4);
 }
 const t=new THREE.CanvasTexture(c);
 t.colorSpace=THREE.SRGBColorSpace;
 t.wrapS=t.wrapT=THREE.RepeatWrapping;
 return t;
}

const grass=new THREE.Mesh(
 new THREE.PlaneGeometry(100,64),
 new THREE.MeshStandardMaterial({map:grassTexture(),roughness:1})
);
grass.rotation.x=-Math.PI/2;
grass.receiveShadow=true;
scene.add(grass);

const lineMat=new THREE.MeshBasicMaterial({color:0xffffff});
function pitchLine(x1,z1,x2,z2){
 const d=new THREE.Vector3(x2-x1,0,z2-z1);
 const m=new THREE.Mesh(new THREE.BoxGeometry(d.length(),.045,.11),lineMat);
 m.position.set((x1+x2)/2,.035,(z1+z2)/2);
 m.rotation.y=-Math.atan2(d.z,d.x);
 scene.add(m);
}
function rect(x1,z1,x2,z2){
 pitchLine(x1,z1,x2,z1);
 pitchLine(x2,z1,x2,z2);
 pitchLine(x2,z2,x1,z2);
 pitchLine(x1,z2,x1,z1);
}
rect(-50,-32,50,32);
pitchLine(0,-32,0,32);

const centerCircle=new THREE.Mesh(
 new THREE.RingGeometry(9.9,10.05,80),
 new THREE.MeshBasicMaterial({color:0xffffff,side:THREE.DoubleSide})
);
centerCircle.rotation.x=-Math.PI/2;
centerCircle.position.y=.05;
scene.add(centerCircle);

function spot(x,z){
 const s=new THREE.Mesh(new THREE.CircleGeometry(.22,16),lineMat);
 s.rotation.x=-Math.PI/2;s.position.set(x,.06,z);scene.add(s);
}
spot(0,0);spot(-40,0);spot(40,0);
rect(-50,-18,-34,18);
rect(34,-18,50,18);
rect(-50,-8,-43,8);
rect(43,-8,50,8);

// STADIUM
const stadium=new THREE.Group();
scene.add(stadium);

const standMat=new THREE.MeshStandardMaterial({color:0x202e3d,roughness:.9});
const darkMat=new THREE.MeshStandardMaterial({color:0x101b27});
const seatColors=[0x183c67,0x9b243d,0x263d55,0xeeeeee];

function makeStand(side){
 for(let tier=0;tier<4;tier++){
  const z=side*(38+tier*3);
  const stand=new THREE.Mesh(
   new THREE.BoxGeometry(108,4,5),
   standMat
  );
  stand.position.set(0,3+tier*4,z);
  stadium.add(stand);

  for(let i=0;i<85;i++){
   const seat=new THREE.Mesh(
    new THREE.BoxGeometry(1,.5,.7),
    new THREE.MeshStandardMaterial({color:seatColors[Math.floor(Math.random()*seatColors.length)]})
   );
   seat.position.set(-52+i*1.25,5+tier*4,z);
   stadium.add(seat);
  }
 }
}
makeStand(-1);
makeStand(1);

for(let side of [-1,1]){
 for(let end of [-1,1]){
  const stand=new THREE.Mesh(new THREE.BoxGeometry(6,17,75),standMat);
  stand.position.set(end*55,8,0);
  stadium.add(stand);
 }
}

// CROWD
const crowdMat=[0x1d4772,0xa8273e,0xe7e8e9,0xf0b33f,0x25374d];
const crowdGeo=new THREE.BoxGeometry(.45,.8,.45);
for(let side of [-1,1]){
 for(let tier=0;tier<4;tier++){
  for(let i=0;i<230;i++){
   const m=new THREE.Mesh(crowdGeo,new THREE.MeshStandardMaterial({
    color:crowdMat[Math.floor(Math.random()*crowdMat.length)]
   }));
   m.position.set(-53+Math.random()*106,5+tier*4+Math.random()*2,side*(36+tier*3));
   stadium.add(m);
  }
 }
}

// GOALS
function createGoal(x,sign){
 const g=new THREE.Group();
 const white=new THREE.MeshStandardMaterial({color:0xffffff,metalness:.3,roughness:.35});
 function bar(a,b){
  const d=b.clone().sub(a);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(.12,.12,d.length(),12),white);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());
  m.castShadow=true;g.add(m);
 }
 const a=new THREE.Vector3(x,0,-7.3);
 const b=new THREE.Vector3(x,3.5,-7.3);
 const c=new THREE.Vector3(x,3.5,7.3);
 const d=new THREE.Vector3(x,0,7.3);
 bar(a,b);bar(b,c);bar(c,d);

 const net=new THREE.Mesh(
  new THREE.BoxGeometry(2.5,3.5,14.6),
  new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.35})
 );
 net.position.set(x+sign*1.2,1.75,0);
 g.add(net);
 scene.add(g);
}
createGoal(-51,-1);
createGoal(51,1);

// PLAYER MODELS
const skinMat=new THREE.MeshStandardMaterial({color:0xc68e69,roughness:.8});
const bootMat=new THREE.MeshStandardMaterial({color:0x151a20,roughness:.5});

function makePlayer(home,index){
 const root=new THREE.Group();

 const main=home?0x102b78:0xe6e9ec;
 const stripe=home?0x9e1e3b:0x303a47;

 const shirt=new THREE.MeshStandardMaterial({color:main,roughness:.8});
 const shorts=new THREE.MeshStandardMaterial({color:home?0x142c58:0x252b32});
 const socks=new THREE.MeshStandardMaterial({color:home?0x8b1f39:0xe9e9e9});

 const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.43,.7,5,12),shirt);
 torso.position.y=1.55;
 torso.castShadow=true;root.add(torso);

 if(home){
  for(let i=-1;i<=1;i++){
   const line=new THREE.Mesh(new THREE.BoxGeometry(.13,.85,.015),new THREE.MeshStandardMaterial({color:stripe}));
   line.position.set(i*.23,1.56,.42);
   root.add(line);
  }
 }

 const head=new THREE.Mesh(new THREE.SphereGeometry(.27,16,14),skinMat);
 head.position.y=2.35;head.castShadow=true;root.add(head);

 const hair=new THREE.Mesh(
  new THREE.SphereGeometry(.28,12,8,0,Math.PI*2,0,Math.PI/2),
  new THREE.MeshStandardMaterial({color:0x30251e})
 );
 hair.position.y=2.43;root.add(hair);

 const limbs=[];
 for(let side of [-1,1]){
  const arm=new THREE.Group();
  arm.position.set(side*.48,1.85,0);
  const upper=new THREE.Mesh(new THREE.CapsuleGeometry(.13,.38,4,8),shirt);
  upper.position.y=-.25;
  upper.rotation.z=-side*.15;
  arm.add(upper);
  const hand=new THREE.Mesh(new THREE.SphereGeometry(.12,8,8),skinMat);
  hand.position.y=-.58;arm.add(hand);
  root.add(arm);
  limbs.push(arm);

  const leg=new THREE.Group();
  leg.position.set(side*.22,1.05,0);
  const thigh=new THREE.Mesh(new THREE.CapsuleGeometry(.16,.43,4,8),shorts);
  thigh.position.y=-.27;leg.add(thigh);
  const sock=new THREE.Mesh(new THREE.CylinderGeometry(.115,.12,.36,8),socks);
  sock.position.y=-.65;leg.add(sock);
  const boot=new THREE.Mesh(new THREE.BoxGeometry(.22,.13,.38),bootMat);
  boot.position.set(0,-.86,.1);leg.add(boot);
  root.add(leg);
  limbs.push(leg);
 }
 root.traverse(o=>{if(o.isMesh)o.castShadow=true;});
 return {mesh:root,limbs};
}

const barca=[],rivals=[];
const homePos=[
 [-40,0],[-30,-20],[-30,-7],[-30,7],[-30,20],
 [-16,-16],[-16,-5],[-16,6],[-16,16],
 [-7,-5],[-7,5]
];
const awayPos=[
 [40,0],[30,-20],[30,-7],[30,7],[30,20],
 [16,-16],[16,-5],[16,6],[16,16],
 [7,-5],[7,5]
];

function buildTeam(team,positions,home){
 positions.forEach((p,i)=>{
  const model=makePlayer(home,i);
  model.mesh.position.set(...[p[0],0,p[1]]);
  scene.add(model.mesh);
  team.push({
   ...model,home,index:i,
   base:new THREE.Vector3(p[0],0,p[1]),
   speed:home?7:5.8,
   phase:Math.random()*6
  });
 });
}
buildTeam(barca,homePos,true);
buildTeam(rivals,awayPos,false);

// BALL
const ballMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.48});
const ball=new THREE.Mesh(new THREE.SphereGeometry(.48,32,24),ballMat);
ball.castShadow=true;
ball.position.set(0,.48,0);
scene.add(ball);

const ballLines=new THREE.Group();
const black=new THREE.MeshStandardMaterial({color:0x151c24});
for(let i=0;i<5;i++){
 const patch=new THREE.Mesh(new THREE.SphereGeometry(.485,8,6),black);
 patch.scale.set(.3,.2,.1);
 patch.position.set(Math.cos(i*1.256)*.3,Math.sin(i*1.256)*.25,.25);
 ballLines.add(patch);
}
ball.add(ballLines);

// GAME STATE
let active=0,homeScore=0,awayScore=0;
let elapsed=0,playing=false,paused=false,sprint=false;
let velocity=new THREE.Vector3();
let joystick={x:0,y:0};
let last=performance.now();
let kickCooldown=0;

const $=id=>document.getElementById(id);
function msg(t){$('message').textContent=t;}
function updateScore(){$('score').textContent=homeScore+' - '+awayScore;}

function current(){return barca[active];}
function dist(a,b){return Math.hypot(a.x-b.x,a.z-b.z);}

function nearestOpponent(){
 return rivals.reduce((best,p)=>{
  return dist(p.mesh.position,ball.position)<dist(best.mesh.position,ball.position)?p:best;
 },rivals[0]);
}

// PLAYER MOVEMENT
function animatePlayer(p,dt,moving){
 const amount=moving?1:0;
 p.phase+=dt*(moving?(sprint?14:9):2);
 p.limbs.forEach((limb,i)=>{
  const swing=Math.sin(p.phase+(i%2)*Math.PI)*.55*amount;
  limb.rotation.x=i<2?-swing:swing;
 });
}

function movePlayer(dt){
 const p=current();
 const move=new THREE.Vector3(joystick.x,0,joystick.y);
 if(move.length()>1)move.normalize();

 const speed=sprint?11:7;
 p.mesh.position.addScaledVector(move,speed*dt);
 p.mesh.position.x=THREE.MathUtils.clamp(p.mesh.position.x,-48,48);
 p.mesh.position.z=THREE.MathUtils.clamp(p.mesh.position.z,-30,30);

 if(move.length()>.05){
  p.mesh.rotation.y=Math.atan2(move.x,move.z);
 }
 animatePlayer(p,dt,move.length()>.05);

 // Dribbling
 const d=dist(p.mesh.position,ball.position);
 if(d<1.75 && ball.position.y<1.4 && kickCooldown<=0){
  const f=new THREE.Vector3(Math.sin(p.mesh.rotation.y),0,Math.cos(p.mesh.rotation.y));
  const target=p.mesh.position.clone().addScaledVector(f,1.25);
  ball.position.x=THREE.MathUtils.damp(ball.position.x,target.x,12,dt);
  ball.position.z=THREE.MathUtils.damp(ball.position.z,target.z,12,dt);
  velocity.x=move.x*speed*.6;
  velocity.z=move.z*speed*.6;
 }
}

// TEAM AI
function updateAI(dt){
 const bx=ball.position.x,bz=ball.position.z;
 barca.forEach((p,i)=>{
  if(i===active)return;
  let tx=p.base.x,tz=p.base.z;
  if(bx>-12){tx+=5;tz+=(bz-tz)*.2;}
  p.mesh.position.x=THREE.MathUtils.damp(p.mesh.position.x,tx,2,dt);
  p.mesh.position.z=THREE.MathUtils.damp(p.mesh.position.z,tz,2,dt);
  animatePlayer(p,dt,dist(p.mesh.position,new THREE.Vector3(tx,0,tz))>.2);
 });

 rivals.forEach((p,i)=>{
  let tx=p.base.x,tz=p.base.z;
  if(i===0){
   tx=39;
   tz=THREE.MathUtils.clamp(bz*.5,-5,5);
  }else if(i===5||i===6||i===7||i===8||i===9||i===10){
   tx+=(bx-tx)*.42;
   tz+=(bz-tz)*.4;
  }else{
   tx+=Math.max(0,bx-4)*.09;
  }
  p.mesh.position.x=THREE.MathUtils.damp(p.mesh.position.x,tx,2,dt);
  p.mesh.position.z=THREE.MathUtils.damp(p.mesh.position.z,tz,2,dt);
  animatePlayer(p,dt,dist(p.mesh.position,new THREE.Vector3(tx,0,tz))>.2);
 });

 // Opponent pressure on ball
 const enemy=nearestOpponent();
 if(dist(enemy.mesh.position,ball.position)<1.7 && ball.position.y<1.3 && kickCooldown<=0){
  velocity.x-=.12;
  velocity.z+=(Math.random()-.5)*.5;
 }
}

// BALL PHYSICS
function updateBall(dt){
 ball.position.addScaledVector(velocity,dt);
 velocity.x*=Math.pow(.985,dt*60);
 velocity.z*=Math.pow(.985,dt*60);

 if(ball.position.y>.48){
  velocity.y-=19*dt;
  ball.position.y+=velocity.y*dt;
  if(ball.position.y<.48){
   ball.position.y=.48;
   velocity.y*=-.35;
   if(Math.abs(velocity.y)<1)velocity.y=0;
  }
 }else{
  ball.position.y=.48;
  velocity.y=0;
 }

 if(Math.abs(ball.position.z)>31.4){
  ball.position.z=Math.sign(ball.position.z)*31.4;
  velocity.z*=-.55;
 }

 if(Math.abs(ball.position.x)>50){
  if(Math.abs(ball.position.z)<7.2 && ball.position.y<3.5){
   if(ball.position.x>0)homeScore++;
   else awayScore++;
   updateScore();
   msg('⚽ GOAL! گل!');
   resetPositions();
   return;
  }
  ball.position.x=Math.sign(ball.position.x)*50;
  velocity.x*=-.65;
 }
 ball.rotation.x+=velocity.z*dt;
 ball.rotation.z-=velocity.x*dt;
}

// COLLISION
function collisions(){
 for(const p of [...barca,...rivals]){
  const dx=ball.position.x-p.mesh.position.x;
  const dz=ball.position.z-p.mesh.position.z;
  const d=Math.hypot(dx,dz);
  if(d<1.15 && ball.position.y<2.2){
   const len=Math.max(d,.01);
   velocity.x+=(dx/len)*.4;
   velocity.z+=(dz/len)*.4;
  }
 }
}

// PASS
function passBall(){
 const p=current();
 if(dist(p.mesh.position,ball.position)>2.5){
  msg('ابتدا به توپ نزدیک شو!');
  return;
 }
 let best=null,bestScore=-Infinity;
 for(let i=0;i<barca.length;i++){
  if(i===active)continue;
  const mate=barca[i];
  const dx=mate.mesh.position.x-p.mesh.position.x;
  const dz=mate.mesh.position.z-p.mesh.position.z;
  const score=dx*1.2-Math.abs(dz)*.3;
  if(score>bestScore){bestScore=score;best=mate;}
 }
 if(!best)return;
 const direction=best.mesh.position.clone().sub(ball.position).normalize();
 velocity.set(direction.x*17,2.2,direction.z*17);
 kickCooldown=.35;
 msg('پاس ارسال شد!');
}

// SHOOT
function shootBall(){
 const p=current();
 if(dist(p.mesh.position,ball.position)>2.7){
  msg('به توپ نزدیک‌تر شو!');
  return;
 }
 const direction=new THREE.Vector3(1,0,0);
 const targetZ=THREE.MathUtils.clamp(-ball.position.z*.35,-4,4);
 direction.z=targetZ/12;
 direction.normalize();
 velocity.set(direction.x*29,8,direction.z*29);
 kickCooldown=.4;
 msg('🔥 SHOT!');
}

// SWITCH
function switchPlayer(){
 let best=active,score=Infinity;
 barca.forEach((p,i)=>{
  const d=dist(p.mesh.position,ball.position);
  if(d<score){score=d;best=i;}
 });
 active=best;
 msg('بازیکن انتخاب شد: '+(active+1));
}

function resetPositions(){
 ball.position.set(0,.48,0);
 velocity.set(0,0,0);
 barca.forEach(p=>p.mesh.position.copy(p.base));
 rivals.forEach(p=>p.mesh.position.copy(p.base));
 active=0;
}

// JOYSTICK
const joy=$('joy'),knob=$('knob');
let pointer=null;
function moveJoy(e){
 const r=joy.getBoundingClientRect();
 let x=e.clientX-r.left-r.width/2;
 let y=e.clientY-r.top-r.height/2;
 const max=38,len=Math.hypot(x,y);
 if(len>max){x=x/len*max;y=y/len*max;}
 joystick.x=x/max;
 joystick.y=y/max;
 const base=(joy.clientWidth-49)/2;
 knob.style.left=base+x+'px';
 knob.style.top=base+y+'px';
}
joy.addEventListener('pointerdown',e=>{
 pointer=e.pointerId;
 joy.setPointerCapture(pointer);
 moveJoy(e);
});
joy.addEventListener('pointermove',e=>{
 if(e.pointerId===pointer)moveJoy(e);
});
function releaseJoy(){
 pointer=null;
 joystick={x:0,y:0};
 knob.style.left=(joy.clientWidth-49)/2+'px';
 knob.style.top=(joy.clientHeight-49)/2+'px';
}
joy.addEventListener('pointerup',releaseJoy);
joy.addEventListener('pointercancel',releaseJoy);

// BUTTONS
$('pass').addEventListener('pointerdown',e=>{
 e.preventDefault();if(playing&&!paused)passBall();
});
$('shoot').addEventListener('pointerdown',e=>{
 e.preventDefault();if(playing&&!paused)shootBall();
});
$('switch').addEventListener('pointerdown',e=>{
 e.preventDefault();if(playing&&!paused)switchPlayer();
});
$('sprint').addEventListener('pointerdown',e=>{
 e.preventDefault();if(playing&&!paused)sprint=true;
});
function stopSprint(){sprint=false;}
$('sprint').addEventListener('pointerup',stopSprint);
$('sprint').addEventListener('pointercancel',stopSprint);
$('sprint').addEventListener('pointerleave',stopSprint);

// CAMERA
function updateCamera(dt){
 const p=current();
 const focus=p.mesh.position.clone().lerp(ball.position,.28);
 const desired=new THREE.Vector3(
  focus.x+18,34,focus.z+29
 );
 camera.position.lerp(desired,1-Math.exp(-2.2*dt));
 camera.lookAt(focus.x,0,focus.z);
}

// CLOCK
function updateClock(dt){
 elapsed+=dt;
 const m=Math.floor(elapsed/60),s=Math.floor(elapsed%60);
 $('clock').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// START AND PAUSE
$('play').onclick=()=>{
 $('start').style.display='none';
 playing=true;
 msg('مسابقه آغاز شد! ⚽');
};
$('pause').onclick=()=>{
 if(!playing)return;
 paused=!paused;
 $('pauseLayer').style.display=paused?'flex':'none';
};
$('resume').onclick=()=>{
 paused=false;
 $('pauseLayer').style.display='none';
};

// RESIZE
addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
});

// LOOP
function animate(now){
 requestAnimationFrame(animate);
 const dt=Math.min((now-last)/1000,.04);
 last=now;
 if(playing&&!paused){
  kickCooldown=Math.max(0,kickCooldown-dt);
  movePlayer(dt);
  updateAI(dt);
  updateBall(dt);
  collisions();
  updateClock(dt);
 }
 updateCamera(dt);
 renderer.render(scene,camera);
}

resetPositions();
camera.position.set(18,34,29);
camera.lookAt(0,0,0);
requestAnimationFrame(animate);

</script>
</body>
</html>
