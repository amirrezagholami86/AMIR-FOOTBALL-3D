
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>AMIR FOOTBALL 3D V6.0.0</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07130d;color:white;font-family:Arial,sans-serif;touch-action:none}
canvas{display:block}
#brand{position:absolute;top:10px;left:12px;z-index:5;font-weight:bold;font-size:12px;text-shadow:0 2px 6px #000}
#brand span{color:#5dffad}
#hud{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:5;background:#07140ddd;border:1px solid #ffffff40;border-radius:14px;padding:8px 13px;display:flex;gap:12px;align-items:center;white-space:nowrap}
#score{font-size:23px;font-weight:900}
#clock{color:#8dffbb;font-size:13px}
#info{position:absolute;top:65px;left:50%;transform:translateX(-50%);z-index:5;background:#06150cdd;border-radius:20px;padding:7px 13px;font-size:11px;white-space:nowrap}
#tools{position:absolute;right:10px;top:100px;z-index:8;display:grid;gap:6px}
.small,.action{border:1px solid #ffffff55;color:white;background:#102c1dE8;border-radius:12px;padding:10px;font-weight:bold}
#controls{position:absolute;bottom:15px;left:0;right:0;z-index:8;display:flex;justify-content:space-between;align-items:end;padding:0 12px;pointer-events:none}
#stickArea{width:140px;height:140px;position:relative;pointer-events:auto}
#stickBase{position:absolute;inset:8px;width:124px;height:124px;border-radius:50%;background:#ffffff19;border:2px solid #ffffff66}
#stick{position:absolute;width:50px;height:50px;left:45px;top:45px;border-radius:50%;background:linear-gradient(145deg,#fff,#9dbbaa);box-shadow:0 3px 12px #0009}
#buttons{display:grid;grid-template-columns:repeat(2,62px);gap:7px;pointer-events:auto}
.action{height:55px;font-size:11px;padding:4px}
#shoot{background:#bd3827}
#pass{background:#1769b2}
#sprint{background:#167b47}
#radar{position:absolute;bottom:170px;left:50%;transform:translateX(-50%);width:125px;height:74px;background:#12653b;border:1px solid #ffffff88;border-radius:8px;z-index:6}
#overlay,#settings{position:absolute;inset:0;z-index:20;background:#06140ef2;display:flex;align-items:center;justify-content:center;padding:18px}
.panel{width:min(430px,95vw);padding:25px;background:#13291f;border:1px solid #ffffff44;border-radius:22px;text-align:center}
.panel h1{font-size:25px;margin:5px}
.panel p{font-size:13px;color:#d0e4d8;line-height:2}
.primary{width:100%;border:0;border-radius:13px;padding:15px;background:linear-gradient(90deg,#14a766,#64e89d);font-size:16px;font-weight:bold}
#settings{display:none}
#settings .panel{text-align:right}
#settings select{width:100%;padding:10px;border-radius:8px;margin:5px 0}
#toast{display:none;position:absolute;z-index:15;top:44%;left:50%;transform:translate(-50%,-50%);background:#06140eee;padding:13px 22px;border-radius:14px;white-space:nowrap}
@media(max-width:600px){
 #buttons{grid-template-columns:repeat(2,57px)}
 .action{height:51px}
 #stickArea{transform:scale(.9);transform-origin:bottom left}
 #radar{bottom:160px}
}
</style>
</head>
<body>
<div id="brand">AMIR <span>FOOTBALL 3D</span><br>AMIRREZA GHOLAMI · V6.0.0</div>
<div id="hud"><b>AMIR FC</b><span id="score">0 - 0</span><b>RIVALS</b><span id="clock">00:00</span></div>
<div id="info">برای شروع مسابقه آماده شو</div>
<div id="tools">
<button class="small" id="pause">Ⅱ توقف</button>
<button class="small" id="cameraBtn">◉ دوربین</button>
<button class="small" id="settingsBtn">⚙ تنظیمات</button>
</div>
<canvas id="radar" width="250" height="148"></canvas>
<div id="controls">
<div id="stickArea"><div id="stickBase"></div><div id="stick"></div></div>
<div id="buttons">
<button class="action" id="pass">پاس</button>
<button class="action" id="shoot">شوت</button>
<button class="action" id="sprint">سرعت</button>
<button class="action" id="switch">تعویض</button>
<button class="action" id="through">پاس عمقی</button>
<button class="action" id="lob">شوت هوایی</button>
<button class="action" id="tackle">توپ‌گیری</button>
<button class="action" id="dribble">دریبل</button>
</div>
</div>
<div id="toast"></div>
<div id="overlay">
<div class="panel">
<h1>⚽ AMIR FOOTBALL 3D</h1>
<b style="color:#62f4a0">VERSION 6.0.0</b>
<p>AMIR FC در برابر RIVALS<br>مسابقه سه‌بعدی فوتبال<br>Created by AMIRREZA GHOLAMI</p>
<button class="primary" id="start">شروع مسابقه</button>
</div>
</div>
<div id="settings">
<div class="panel">
<h2>تنظیمات مسابقه</h2>
<label>مدت مسابقه</label>
<select id="duration"><option value="180">۳ دقیقه</option><option value="300">۵ دقیقه</option><option value="600">۱۰ دقیقه</option></select>
<label>سرعت بازی</label>
<select id="speed"><option value="1">عادی</option><option value="1.2">سریع</option><option value=".8">آرام</option></select>
<button class="primary" id="closeSettings">بازگشت</button>
</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
"use strict";
/* AMIR FOOTBALL 3D V6.0.0
   Created by AMIRREZA GHOLAMI
*/
const $=id=>document.getElementById(id);
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91c7e7);
scene.fog=new THREE.Fog(0x91c7e7,110,220);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,350);
camera.position.set(0,48,66);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x315b3b,2));
const sun=new THREE.DirectionalLight(0xffffff,2.5);
sun.position.set(-35,65,30);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-65;sun.shadow.camera.right=65;
sun.shadow.camera.top=65;sun.shadow.camera.bottom=-65;
scene.add(sun);
const mat=(c,r=.8)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const white=mat(0xffffff),blue=mat(0x176bd0),red=mat(0xd52e3a);
const grass=new THREE.Mesh(new THREE.PlaneGeometry(106,70),mat(0x237a40));
grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;scene.add(grass);
for(let i=0;i<10;i++){
 let s=new THREE.Mesh(new THREE.PlaneGeometry(10.6,70),mat(i%2?0x287f43:0x206e3c));
 s.rotation.x=-Math.PI/2;s.position.set(-47.7+i*10.6,.012,0);scene.add(s);
}
function pitchLine(x,z,w,h){
 const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),white);
 m.rotation.x=-Math.PI/2;m.position.set(x,.035,z);scene.add(m);
}
pitchLine(0,0,.14,64);pitchLine(-50,0,.14,64);pitchLine(50,0,.14,64);
pitchLine(0,-32,100,.14);pitchLine(0,32,100,.14);
const centerCircle=new THREE.Mesh(new THREE.RingGeometry(9.1,9.25,64),white);
centerCircle.rotation.x=-Math.PI/2;centerCircle.position.y=.04;scene.add(centerCircle);
const dot=new THREE.Mesh(new THREE.CircleGeometry(.24,24),white);
dot.rotation.x=-Math.PI/2;dot.position.y=.045;scene.add(dot);
for(let side of [-1,1]){
 pitchLine(side*39,0,.12,36);pitchLine(side*39,0,22,.12);
 pitchLine(side*44,0,.12,18);pitchLine(side*44,0,12,.12);
}
const crowdMats=[0xdceaf2,0xe34b4b,0x2477cf,0xe5c34b,0x222b38].map(c=>mat(c));
for(let side of [-1,1]){
 const stand=new THREE.Mesh(new THREE.BoxGeometry(110,9,13),mat(0x53616b));
 stand.position.set(0,5.5,side*40);scene.add(stand);
 for(let row=0;row<4;row++)for(let i=0;i<90;i++){
  const person=new THREE.Mesh(new THREE.BoxGeometry(.48,.65,.42),crowdMats[(i+row)%5]);
  person.position.set(-53+i*1.2,10+row*.85,side*(35+row*1.8));scene.add(person);
 }
}
// Goals
for(const x of [-51,51]){
 const goal=new THREE.Group(),pm=mat(0xffffff,.3);
 function bar(a,b,r=.17){
  const d=new THREE.Vector3().subVectors(b,a);
  const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,d.length(),10),pm);
  m.position.copy(a).add(b).multiplyScalar(.5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.normalize());goal.add(m);
 }
 bar(new THREE.Vector3(x,0,-8),new THREE.Vector3(x,5,-8));
 bar(new THREE.Vector3(x,0,8),new THREE.Vector3(x,5,8));
 bar(new THREE.Vector3(x,5,-8),new THREE.Vector3(x,5,8));
 for(let z=-8;z<=8;z+=2)bar(new THREE.Vector3(x,0,z),new THREE.Vector3(x+(x>0?4:-4),4,z),.045);
 scene.add(goal);
}
// Ball
const ball=new THREE.Group();
const core=new THREE.Mesh(new THREE.SphereGeometry(.85,32,24),mat(0xffffff,.35));
core.castShadow=true;ball.add(core);
const black=mat(0x11151a,.45);
for(let i=0;i<12;i++){
 const phi=Math.acos(1-2*(i+.5)/12),theta=i*2.399;
 const patch=new THREE.Mesh(new THREE.CircleGeometry(.19,5),black);
 patch.position.set(.855*Math.sin(phi)*Math.cos(theta),.855*Math.cos(phi),.855*Math.sin(phi)*Math.sin(theta));
 patch.lookAt(patch.position.clone().multiplyScalar(2));ball.add(patch);
}
scene.add(ball);
const shadow=new THREE.Mesh(new THREE.CircleGeometry(1.1,28),new THREE.MeshBasicMaterial({color:0x000000,transparent:true,opacity:.28}));
shadow.rotation.x=-Math.PI/2;shadow.position.y=.035;scene.add(shadow);
const bp=new THREE.Vector3(0,.85,0),bv=new THREE.Vector3();
// Players
const home=[],away=[];
function player(team,i,x,z){
 const g=new THREE.Group(),shirt=new THREE.Mesh(new THREE.CylinderGeometry(.48,.55,1.15,14),team?red:blue);
 shirt.position.y=1.35;shirt.castShadow=true;g.add(shirt);
 const shorts=new THREE.Mesh(new THREE.BoxGeometry(.8,.38,.55),mat(0x151c28));shorts.position.y=.65;g.add(shorts);
 const skin=mat(0xe3b18d),head=new THREE.Mesh(new THREE.SphereGeometry(.3,16,14),skin);
 head.position.y=2.15;g.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.31,14,10),mat(0x30231c));
 hair.scale.set(1,.55,1);hair.position.y=2.35;g.add(hair);
 for(const side of [-1,1]){
  const leg=new THREE.Mesh(new THREE.CylinderGeometry(.13,.12,.65,10),skin);
  leg.position.set(side*.23,.22,0);g.add(leg);
  const boot=new THREE.Mesh(new THREE.BoxGeometry(.28,.15,.45),mat(0x101820));
  boot.position.set(side*.23,-.08,.12);g.add(boot);
  const arm=new THREE.Mesh(new THREE.CylinderGeometry(.12,.11,.8,10),skin);
  arm.position.set(side*.58,1.35,0);arm.rotation.z=side*.15;g.add(arm);
 }
 g.position.set(x,0,z);scene.add(g);
 const p={group:g,team,index:i,x,z,vx:0,vz:0,stamina:100,speed:team?7.5:8.2,homeX:x,homeZ:z};
 (team?away:home).push(p);
}
const formation=[[-44,0],[-34,-19],[-34,-7],[-34,7],[-34,19],[-20,-20],[-19,-7],[-19,7],[-20,20],[-7,-9],[-7,9]];
formation.forEach((p,i)=>player(0,i,p[0],p[1]));
formation.forEach((p,i)=>player(1,i,-p[0],p[1]));
let selected=9,owner=0,carrier=9;
let homeScore=0,awayScore=0,elapsed=0,duration=180,speedScale=1;
let running=false,paused=false,finished=false,cameraMode=0;
let joystick={x:0,y:0},sprinting=false,keys=new Set(),toastTime=0;
function toast(t){$("toast").textContent=t;$("toast").style.display="block";toastTime=1.3}
function distance(a,b){return Math.hypot(a.x-b.x,a.z-b.z)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function nearestHome(){
 let best=0,d=Infinity;
 home.forEach((p,i)=>{let n=distance(p,bp);if(n<d){d=n;best=i}});
 return best;
}
function updateHUD(){
 $("score").textContent=homeScore+" - "+awayScore;
 const s=Math.max(0,Math.floor(duration-elapsed));
 $("clock").textContent=String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
 $("info").textContent="بازیکن "+(selected+1)+" | "+(owner===0?"مالکیت AMIR FC":owner===1?"مالکیت حریف":"توپ آزاد");
}
function resetPositions(){
 home.forEach(p=>{p.x=p.homeX;p.z=p.homeZ;p.vx=p.vz=0});
 away.forEach(p=>{p.x=p.homeX;p.z=p.homeZ;p.vx=p.vz=0});
 bp.set(0,.85,0);bv.set(0,0,0);owner=0;carrier=9;selected=9;
}
function takeBall(team,i){owner=team;carrier=i}
function kick(power,lift,target){
 const p=home[selected];
 if(owner!==0&&distance(p,bp)>2.5){toast("به توپ نزدیک شو");return}
 let dx=target.x-bp.x,dz=target.z-bp.z,l=Math.hypot(dx,dz)||1;
 bv.set(dx/l*power,lift,dz/l*power);
 owner=-1;carrier=-1;
}
function pass(through=false){
 const p=home[selected];
 if(owner!==0&&distance(p,bp)>2.5){toast("توپ در اختیار شما نیست");return}
 const candidates=home.filter(q=>q.index!==selected).sort((a,b)=>{
  const sa=Math.abs((a.x-p.x)-(through?12:5))*.7+distance(a,p)*.3;
  const sb=Math.abs((b.x-p.x)-(through?12:5))*.7+distance(b,p)*.3;
  return sa-sb;
 });
 const t=candidates[0];kick(through?12:10,through?1:.3,t);
}
function shoot(lob=false){
 const p=home[selected];
 if(owner!==0&&distance(p,bp)>2.5){toast("برای شوت به توپ نزدیک شو");return}
 const z=clamp(-p.z*.35+(Math.random()-.5)*5,-6.5,6.5);
 kick(lob?17:21,lob?7:2.5,{x:60,z});
}
function tackle(){
 const p=home[selected];
 const e=away.slice(1).sort((a,b)=>distance(a,p)-distance(b,p))[0];
 if(owner===1&&e&&distance(e,p)<3.2){
  takeBall(0,selected);bp.set(p.x+1,.85,p.z);toast("توپ‌گیری موفق!");
 }else toast("حریف نزدیک نیست");
}
function switchPlayer(){selected=nearestHome();toast("بازیکن "+(selected+1))}
function moveToward(p,x,z,sp,dt){
 const dx=x-p.x,dz=z-p.z,l=Math.hypot(dx,dz);
 if(l>.1){p.vx+=(dx/l*sp-p.vx)*Math.min(1,dt*5);p.vz+=(dz/l*sp-p.vz)*Math.min(1,dt*5)}
 else{p.vx*=.8;p.vz*=.8}
}
function updatePlayers(dt){
 const p=home[selected];
 let ix=joystick.x,iz=joystick.y;
 if(keys.has("ArrowLeft")||keys.has("a"))ix--;
 if(keys.has("ArrowRight")||keys.has("d"))ix++;
 if(keys.has("ArrowUp")||keys.has("w"))iz--;
 if(keys.has("ArrowDown")||keys.has("s"))iz++;
 const il=Math.hypot(ix,iz);if(il>1){ix/=il;iz/=il}
 const boost=sprinting&&p.stamina>1?1.4:1;
 if(owner===0&&carrier===selected){
  p.vx+=(ix*p.speed*boost-p.vx)*Math.min(1,dt*8);
  p.vz+=(iz*p.speed*boost-p.vz)*Math.min(1,dt*8);
 }else moveToward(p,bp.x,bp.z,p.speed*boost,dt);
 home.forEach((q,i)=>{
  if(i===selected)return;
  let tx=q.homeX,tz=q.homeZ;
  if(i===9||i===10){tx=clamp(q.homeX+Math.max(0,bp.x)*.35,-40,42);tz=q.homeZ}
  moveToward(q,tx,tz,q.speed*.7,dt);
 });
 away.forEach((q,i)=>{
  if(i===0)moveToward(q,clamp(bp.x,43,47),clamp(bp.z,-5,5),6.5,dt);
  else if(owner!==1)moveToward(q,bp.x-2,bp.z,6.3,dt);
  else moveToward(q,q.homeX+5,q.homeZ,5.5,dt);
 });
 [...home,...away].forEach(q=>{
  q.x=clamp(q.x+q.vx*dt,-48,48);q.z=clamp(q.z+q.vz*dt,-29,29);
  q.group.position.set(q.x,0,q.z);
  if(Math.hypot(q.vx,q.vz)>.3)q.group.rotation.y=Math.atan2(q.vx,q.vz);
  q.stamina=clamp(q.stamina+(q===p&&sprinting?-12:3)*dt,0,100);
 });
}
function updateBall(dt){
 if(owner===0||owner===1){
  const p=(owner===0?home:away)[carrier];
  if(p){bp.x=p.x+Math.sin(p.group.rotation.y)*1.05;bp.z=p.z+Math.cos(p.group.rotation.y)*1.05;bp.y=.85}
 }else{
  bv.y-=18*dt;bp.addScaledVector(bv,dt);
  if(bp.y<.85){bp.y=.85;if(bv.y< -1)bv.y*=-.48;else bv.y=0;bv.x*=.985;bv.z*=.985}
  if(Math.abs(bp.z)>32){bp.z=clamp(bp.z,-32,32);bv.z*=-.65}
  if(Math.abs(bp.x)>49){
   if(Math.abs(bp.z)<8.1&&bp.y<5.2){
    if(bp.x>0)homeScore++;else awayScore++;
    toast("گــــل!");
    resetPositions();
   }else{bp.x=clamp(bp.x,-49,49);bv.x*=-.65}
  }
  [...home,...away].forEach(p=>{
   const d=distance(p,bp);
   if(d<1.35&&bp.y<2.1){
    if(d>.01){bp.x=p.x+(bp.x-p.x)/d*1.35;bp.z=p.z+(bp.z-p.z)/d*1.35}
    if(Math.hypot(bv.x,bv.z)<3.5)takeBall(p.team,p.index);
    else{bv.x+=p.vx*.15;bv.z+=p.vz*.15}
   }
  });
  if(owner===-1){
   const defenders=home.slice().sort((a,b)=>distance(a,bp)-distance(b,bp));
   const enemy=away.slice().sort((a,b)=>distance(a,bp)-distance(b,bp))[0];
   if(enemy&&distance(enemy,bp)<1.4&&Math.random()<dt*1.2)takeBall(1,enemy.index);
   if(defenders[0]&&distance(defenders[0],bp)<1.2&&Math.random()<dt*1.2){takeBall(0,defenders[0].index);selected=defenders[0].index}
  }
 }
 ball.position.copy(bp);
 ball.rotation.x+=bv.z*dt;ball.rotation.z-=bv.x*dt;
 shadow.position.set(bp.x,.04,bp.z);
 shadow.scale.setScalar(clamp(1.1-bp.y*.035,.55,1));
}
function updateCamera(dt){
 let target=new THREE.Vector3();
 if(cameraMode===1){
  camera.position.lerp(new THREE.Vector3(0,72,85),Math.min(1,dt*2));camera.lookAt(0,0,0);
 }else{
  target.set((home[selected].x+bp.x)/2,0,(home[selected].z+bp.z)/2);
  const d=cameraMode===2?new THREE.Vector3(bp.x-18,25,bp.z+27):new THREE.Vector3(target.x-3,42,target.z+43);
  camera.position.lerp(d,Math.min(1,dt*2.8));camera.lookAt(target);
 }
}
function drawRadar(){
 const c=$("radar").getContext("2d");c.clearRect(0,0,250,148);
 c.fillStyle="#176d3e";c.fillRect(0,0,250,148);
 c.strokeStyle="#fff";c.lineWidth=2;c.strokeRect(2,2,246,144);
 c.beginPath();c.moveTo(125,0);c.lineTo(125,148);c.stroke();
 c.beginPath();c.arc(125,74,18,0,Math.PI*2);c.stroke();
 function d(p,color,r=4){c.fillStyle=color;c.beginPath();c.arc(125+p.x*2.35,74+p.z*2.1,r,0,7);c.fill()}
 home.forEach(p=>d(p,"#45a5ff"));away.forEach(p=>d(p,"#ff5656"));d(bp,"white",4);
}
const bind=(id,fn)=>$(id).addEventListener("pointerdown",e=>{e.preventDefault();fn()});
bind("pass",()=>pass(false));bind("through",()=>pass(true));
bind("shoot",()=>shoot(false));bind("lob",()=>shoot(true));
bind("switch",switchPlayer);bind("tackle",tackle);
bind("dribble",()=>{toast("دریبل فعال");home[selected].speed=10;setTimeout(()=>home[selected].speed=8.2,900)});
$("sprint").addEventListener("pointerdown",()=>sprinting=true);
["pointerup","pointercancel","pointerleave"].forEach(e=>$("sprint").addEventListener(e,()=>sprinting=false));
let stickPointer=null;
function setStick(e){
 const r=$("stickBase").getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
 let x=e.clientX-cx,y=e.clientY-cy,l=Math.hypot(x,y),m=43;
 if(l>m){x=x/l*m;y=y/l*m}
 joystick.x=x/m;joystick.y=y/m;
 $("stick").style.left=45+x+"px";$("stick").style.top=45+y+"px";
}
$("stickArea").addEventListener("pointerdown",e=>{stickPointer=e.pointerId;$("stickArea").setPointerCapture(e.pointerId);setStick(e)});
$("stickArea").addEventListener("pointermove",e=>{if(e.pointerId===stickPointer)setStick(e)});
function releaseStick(){stickPointer=null;joystick.x=joystick.y=0;$("stick").style.left="45px";$("stick").style.top="45px"}
$("stickArea").addEventListener("pointerup",releaseStick);
$("stickArea").addEventListener("pointercancel",releaseStick);
window.addEventListener("keydown",e=>{
 keys.add(e.key);
 if(e.key===" ")shoot();
 if(e.key==="e")pass();
 if(e.key==="q")switchPlayer();
 if(e.key==="p"||e.key==="Escape")togglePause();
});
window.addEventListener("keyup",e=>keys.delete(e.key));
function togglePause(){
 if(!running||finished)return;
 paused=!paused;$("pause").textContent=paused?"▶ ادامه":"Ⅱ توقف";
}
$("pause").onclick=togglePause;
$("cameraBtn").onclick=()=>{cameraMode=(cameraMode+1)%3;toast("دوربین "+(cameraMode+1))};
$("settingsBtn").onclick=()=>{$("settings").style.display="flex";paused=true};
$("closeSettings").onclick=()=>{
 duration=Number($("duration").value);speedScale=Number($("speed").value);
 $("settings").style.display="none";paused=false;
};
function startGame(){
 $("overlay").style.display="none";running=true;paused=false;finished=false;
 duration=Number($("duration").value);speedScale=Number($("speed").value);
}
$("start").onclick=startGame;
function endGame(){
 running=false;finished=true;
 $("overlay").style.display="flex";
 $("overlay").querySelector("h1").textContent="پایان مسابقه";
 $("overlay").querySelector("p").innerHTML="نتیجه: AMIR FC "+homeScore+" - "+awayScore+" RIVALS<br>AMIRREZA GHOLAMI";
 $("start").textContent="مسابقه دوباره";
 $("start").onclick=()=>{
  homeScore=awayScore=elapsed=0;resetPositions();updateHUD();
  $("overlay").querySelector("h1").textContent="⚽ AMIR FOOTBALL 3D";
  $("overlay").querySelector("p").innerHTML="AMIR FC در برابر RIVALS<br>Created by AMIRREZA GHOLAMI";
  $("start").textContent="شروع مسابقه";$("start").onclick=startGame;
 };
}
let previous=performance.now();
function animate(now){
 requestAnimationFrame(animate);
 const raw=Math.min((now-previous)/1000,.05);previous=now;
 if(running&&!paused&&!finished){
  const dt=raw*speedScale;elapsed+=dt;
  updatePlayers(dt);updateBall(dt);updateCamera(dt);updateHUD();
  if(elapsed>=duration)endGame();
 }
 if(toastTime>0){toastTime-=raw;if(toastTime<=0)$("toast").style.display="none"}
 drawRadar();renderer.render(scene,camera);
}
window.addEventListener("resize",()=>{
 camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
});
updateHUD();requestAnimationFrame(animate);
</script>
</body>
</html>
