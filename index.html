<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#07111d;font-family:Arial,sans-serif;color:white;touch-action:none}
canvas{display:block}

.team{font-weight:900;font-size:15px}
.score{font-size:27px;font-weight:900;letter-spacing:5px}

.panel{width:min(440px,90vw);padding:30px;background:#091827f5;border:1px solid #ffffff2b;border-radius:22px;text-align:center;box-shadow:0 20px 70px #000b}
.panel h1{font-size:30px;margin:0 0 5px;color:#fff}

.start{border:0;background:linear-gradient(110deg,#00aaff,#00d5a8);padding:15px 38px;border-radius:12px;color:#00121b;font-weight:900;font-size:16px;margin-top:14px}
#pause{position:fixed;right:14px;top:85px;z-index:8;background:#061522cc;color:white;border:1px solid #ffffff55;border-radius:9px;padding:9px 13px}
@media(max-width:600px){#brand{font-size:9px;padding:6px 8px}#hud{gap:8px;padding:8px 12px;top:10px}.team{font-size:11px}.score{font-size:23px}#status{top:66px;font-size:11px}#controls{padding:0 14px;bottom:16px}#stick{width:112px;height:112px}#knob{left:31px;top:31px}.actions{grid-template-columns:repeat(2,58px);gap:8px}.act{height:54px}}

{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x91b9d0);
scene.fog=new THREE.Fog(0x91b9d0,75,180);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);
camera.position.set(0,27,39);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.15;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xd9edff,0x31412d,2.1));
const sun=new THREE.DirectionalLight(0xfff4dc,2.6);
sun.position.set(-25,42,20);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-65;sun.shadow.camera.right=65;
sun.shadow.camera.top=55;sun.shadow.camera.bottom=-55;
scene.add(sun);

const mat=(color,roughness=.8,metalness=0)=>new THREE.MeshStandardMaterial({color,roughness,metalness});
const green1=mat(0x267c3b),green2=mat(0x2c8741);
const white=mat(0xffffff),dark=mat(0x111923),red=mat(0xd92936);
const blue=mat(0x0876e9),skin=mat(0xb77c59),black=mat(0x101319);
const gold=mat(0xd5b45c,.4,.5);

function box(w,h,d,material,x,y,z,parent=scene){
 const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),material);
 m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function line(x1,z1,x2,z2,y=.035){
 const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
 const m=new THREE.Mesh(new THREE.BoxGeometry(len,.035,.11),white);
 m.position.set((x1+x2)/2,y,(z1+z2)/2);
 m.rotation.y=-Math.atan2(dz,dx);scene.add(m);return m;
}

// زمین مسابقه
const field=new THREE.Group();scene.add(field);
for(let i=0;i<12;i++){
 const strip=new THREE.Mesh(new THREE.PlaneGeometry(8,68),i%2?green1:green2);
 strip.rotation.x=-Math.PI/2;strip.position.set(-44+i*8,0,0);
 strip.receiveShadow=true;field.add(strip);
}
box(112,.5,82,mat(0x183a2c),0,-.45,0);

// خطوط زمین
line(-48,-32,48,-32);line(-48,32,48,32);
line(-48,-32,-48,32);line(48,-32,48,32);
line(0,-32,0,32);
const circle=new THREE.Mesh(new THREE.RingGeometry(9.9,10.05,80),white);
circle.rotation.x=-Math.PI/2;circle.position.y=.07;scene.add(circle);
const spot=new THREE.Mesh(new THREE.CircleGeometry(.18,20),white);
spot.rotation.x=-Math.PI/2;spot.position.set(0,.08,0);scene.add(spot);

function rectangle(x,z,w,d){
 line(x-w/2,z-d/2,x+w/2,z-d/2);
 line(x-w/2,z+d/2,x+w/2,z+d/2);
 line(x-w/2,z-d/2,x-w/2,z+d/2);
 line(x+w/2,z-d/2,x+w/2,z+d/2);
}
rectangle(-38,0,20,42);rectangle(38,0,20,42);
rectangle(-44,0,6,18);rectangle(44,0,6,18);

// محوطه ورزشگاه
box(140,4,9,mat(0x172a3a),0,3,-47);
box(140,4,9,mat(0x172a3a),0,3,47);
box(9,4,90,mat(0x172a3a),-68,3,0);
box(9,4,90,mat(0x172a3a),68,3,0);

for(let tier=0;tier<4;tier++){
 const seatMat=mat([0x163c5b,0x174e70,0x18334e,0x263e55][tier]);
 const y=5+tier*2.1;
 for(const z of [-40,40]){
  const stand=box(130,1.8,13,seatMat,0,y,z);
  stand.rotation.x=z<0?-.12:.12;
 }
 for(const x of [-62,62]){
  const stand=box(13,1.8,75,seatMat,x,y,0);
  stand.rotation.z=x<0?.12:-.12;
 }
}

// تماشاگران با InstancedMesh
const crowdGeo=new THREE.BoxGeometry(.42,.8,.35);
const crowdMats=[0xe8e9e7,0x1d85c5,0xd53c42,0xe5b83f,0x39a66a].map(c=>mat(c));
for(let side=0;side<4;side++){
 for(let colorIndex=0;colorIndex<crowdMats.length;colorIndex++){
  const count=side<2?220:120;
  const inst=new THREE.InstancedMesh(crowdGeo,crowdMats[colorIndex],count);
  const dummy=new THREE.Object3D();
  for(let i=0;i<count;i++){
   const a=i/count;
   let x,z;
   if(side===0){x=-60+a*120;z=-43+Math.random()*5}
   if(side===1){x=-60+a*120;z=38+Math.random()*5}
   if(side===2){x=-64+Math.random()*5;z=-35+a*70}
   if(side===3){x=59+Math.random()*5;z=-35+a*70}
   dummy.position.set(x,7+Math.random()*7,z);
   dummy.rotation.y=Math.random()*6.28;
   dummy.scale.setScalar(.65+Math.random()*.65);
   dummy.updateMatrix();inst.setMatrixAt(i,dummy.matrix);
  }
  scene.add(inst);
 }
}

// تابلوهای تبلیغاتی
const adMat=[0x04a9e7,0xe5b52c,0xd93149,0x1eaa77].map(c=>mat(c,.5,.2));
for(let i=0;i<16;i++){
 const x=-43+i*5.7;
 box(5.4,1.3,.45,adMat[i%4],x,.9,-34.2);
 box(5.4,1.3,.45,adMat[(i+1)%4],x,.9,34.2);
}

// دروازه و تور
function goal(x,dir){
 const frame=new THREE.Group();scene.add(frame);
 const z=0;
 const postMat=mat(0xffffff,.25,.35);
 for(const zz of [-9,9]){
  const post=box(.35,4,.35,postMat,x,2,zz);
 }
 box(.35,.35,18,postMat,x,4,0);
 const netMat=new THREE.MeshBasicMaterial({color:0xffffff,wireframe:true,transparent:true,opacity:.35});
 const net=new THREE.Mesh(new THREE.BoxGeometry(5,4,18,8,6,12),netMat);
 net.position.set(x+dir*2.5,2,0);scene.add(net);
}
goal(-50,-1);goal(50,1);

// نورافکن‌ها
for(const x of [-57,57]){
 for(const z of [-39,39]){
  const pole=box(.5,24,.5,mat(0x657786,.4,.7),x,12,z);
  box(5,1,.8,mat(0xdcefff, .25),x,24,z);
  const light=new THREE.SpotLight(0xe4f2ff,75,100,.8,.5,1);
  light.position.set(x,23,z);light.target.position.set(x*.6,0,z*.5);
  scene.add(light,light.target);
 }
}

// بازیکنان
const playerGeo={
 torso:new THREE.CapsuleGeometry(.55,.9,5,9),
 head:new THREE.SphereGeometry(.34,14,12),
 limb:new THREE.CapsuleGeometry(.16,.55,4,8),
 boot:new THREE.BoxGeometry(.22,.16,.38)
};
function makePlayer(team,x,z,keeper=false){
 const root=new THREE.Group();scene.add(root);root.position.set(x,0,z);
 const shirt=team===0?blue:red;
 const shorts=team===0?mat(0x102d59):mat(0xeeeeee);
 const socks=team===0?blue:white;
 const body=new THREE.Mesh(playerGeo.torso,shirt);body.position.y=1.5;body.castShadow=true;root.add(body);
 const head=new THREE.Mesh(playerGeo.head,skin);head.position.y=2.45;head.castShadow=true;root.add(head);
 const hair=new THREE.Mesh(new THREE.SphereGeometry(.35,12,8),black);
 hair.scale.y=.45;hair.position.y=2.65;root.add(hair);
 const shortsMesh=box(.85,.38,.55,shorts,0,.95,0,root);
 const limbs=[];
 for(const side of [-1,1]){
  const leg=new THREE.Group();leg.position.set(side*.27,1,0);root.add(leg);
  const upper=new THREE.Mesh(playerGeo.limb,shorts);upper.position.y=-.25;leg.add(upper);
  const lower=new THREE.Group();lower.position.y=-.5;leg.add(lower);
  const shin=new THREE.Mesh(playerGeo.limb,socks);shin.scale.set(.85,1,.85);shin.position.y=-.28;lower.add(shin);
  const boot=new THREE.Mesh(playerGeo.boot,black);boot.position.set(0,-.59,.12);lower.add(boot);
  limbs.push({upper:leg,lower});
  const arm=new THREE.Group();arm.position.set(side*.62,1.85,0);root.add(arm);
  const armMesh=new THREE.Mesh(playerGeo.limb,shirt);armMesh.rotation.z=side*.15;armMesh.position.y=-.35;arm.add(armMesh);
 }
 root.userData={team,limbs,keeper};
 return root;
}

const home=[],away=[];
const formation=[
 [-35,0],[-25,-22],[-25,-8],[-25,8],[-25,22],
 [-8,-23],[-8,-8],[-8,8],[-8,23],
 [12,-10],[12,10]
];
for(let i=0;i<11;i++){
 const [x,z]=formation[i];
 home.push(makePlayer(0,x,z,i===0));
 away.push(makePlayer(1,-x,-z,i===0));
}
home[0].position.set(-45,0,0);away[0].position.set(45,0,0);

// توپ
const ball=new THREE.Group();scene.add(ball);
const sphere=new THREE.Mesh(new THREE.SphereGeometry(.48,24,18),mat(0xffffff,.38));
sphere.castShadow=true;ball.add(sphere);
const seam=new THREE.Mesh(new THREE.TorusGeometry(.32,.018,5,24),mat(0x222222));
seam.rotation.x=Math.PI/2;ball.add(seam);
ball.position.set(0,.5,0);
let velocity=new THREE.Vector3();
let selected=9,score1=0,score2=0;
let playing=false,paused=false,elapsed=0,last=performance.now();
let sprinting=false;
let stick={x:0,y:0};
const clockEl=document.getElementById('clock');
const statusEl=document.getElementById('status');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>a.position.distanceTo(b.position);
const active=()=>home[selected];

// کنترل‌ها
function moveStick(e){
 const r=document.getElementById('stick').getBoundingClientRect();
 const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy),max=42;
 const k=Math.min(1,max/(len||1));
 stick.x=dx*k/max;stick.y=dy*k/max;
 document.getElementById('knob').style.transform=`translate(${stick.x*42}px,${stick.y*42}px)`;
}
const stickEl=document.getElementById('stick');
stickEl.addEventListener('pointerdown',e=>{stickEl.setPointerCapture(e.pointerId);moveStick(e)});
stickEl.addEventListener('pointermove',e=>{if(e.buttons)moveStick(e)});
function resetStick(){stick={x:0,y:0};document.getElementById('knob').style.transform='translate(0,0)'}
stickEl.addEventListener('pointerup',resetStick);
stickEl.addEventListener('pointercancel',resetStick);

document.getElementById('sprint').onpointerdown=()=>sprinting=true;
document.getElementById('sprint').onpointerup=()=>sprinting=false;
document.getElementById('sprint').onpointerleave=()=>sprinting=false;

function nearestOpponent(){
 return away.reduce((a,p)=>dist(p,ball)<dist(a,ball)?p:a,away[0]);
}
function passBall(){
 if(!playing||paused)return;
 const p=active();
 const mates=home.filter((m,i)=>i!==selected);
 const target=mates.reduce((a,b)=>b.position.x>a.position.x?b:a,mates[0]);
 const dir=target.position.clone().sub(ball.position).normalize();
 velocity.copy(dir.multiplyScalar(18));velocity.y=3;
 statusEl.textContent='پاس ارسال شد';
}
function shootBall(){
 if(!playing||paused)return;
 const p=active();
 const dir=new THREE.Vector3(1,0,0);
 dir.z=clamp((p.position.z-ball.position.z)*.07,-.35,.35);
 dir.normalize();
 velocity.copy(dir.multiplyScalar(29));velocity.y=7;
 statusEl.textContent='شوووت!';
}
function switchPlayer(){
 selected=(selected+1)%home.length;
 statusEl.textContent='بازیکن انتخاب‌شده تغییر کرد';
}
document.getElementById('pass').onclick=passBall;
document.getElementById('shoot').onclick=shootBall;
document.getElementById('switch').onclick=switchPlayer;
document.getElementById('pause').onclick=()=>{
 paused=!paused;
 document.getElementById('pause').textContent=paused?'▶ ادامه':'Ⅱ توقف';
 statusEl.textContent=paused?'مسابقه متوقف شد':'مسابقه ادامه دارد';
};
document.getElementById('start').onclick=()=>{
 document.getElementById('menu').style.display='none';
 playing=true;statusEl.textContent='سوت آغاز مسابقه!';
};

// کیبورد
const keys={};
addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key===' ')shootBall();
 if(e.key.toLowerCase()==='e')passBall();
 if(e.key.toLowerCase()==='q')switchPlayer();
});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);

// حرکت بازیکنان
function animatePlayer(p,t,move){
 const speed=move?Math.min(1,move):0;
 p.userData.limbs.forEach((l,i)=>{
  l.upper.rotation.x=Math.sin(t*10+i*Math.PI)*.65*speed;
  l.lower.rotation.x=Math.max(0,Math.sin(t*10+i*Math.PI+1))*.8*speed;
 });
}
function moveToward(p,target,speed,dt){
 const dx=target.x-p.position.x,dz=target.z-p.position.z;
 const len=Math.hypot(dx,dz);
 if(len>.3){
  p.position.x+=dx/len*speed*dt;
  p.position.z+=dz/len*speed*dt;
  p.rotation.y=Math.atan2(dx,dz);
  animatePlayer(p,elapsed,1);
 }else animatePlayer(p,elapsed,0);
 p.position.x=clamp(p.position.x,-47,47);
 p.position.z=clamp(p.position.z,-29,29);
}

function goalCheck(){
 if(Math.abs(ball.position.x)>50 && Math.abs(ball.position.z)<9 && ball.position.y<4.5){
  if(ball.position.x>0)score1++;else score2++;
  document.getElementById('s1').textContent=score1;
  document.getElementById('s2').textContent=score2;
  statusEl.textContent='گـــــل! ⚽';
  ball.position.set(0,.5,0);velocity.set(0,0,0);
  home.forEach((p,i)=>p.position.set(formation[i][0],0,formation[i][1]));
  away.forEach((p,i)=>p.position.set(-formation[i][0],0,-formation[i][1]));
 }
}

// حلقه بازی
function update(dt){
 if(!playing||paused)return;
 elapsed+=dt;
 const minutes=Math.floor(elapsed/3);
 const seconds=Math.floor((elapsed%3)/3*60);
 clockEl.textContent=String(minutes).padStart(2,'0')+':'+String(seconds).padStart(2,'0');

 const p=active();
 const forward=-stick.y+(keys.w?1:0)-(keys.s?1:0);
 const sideways=stick.x+(keys.d?1:0)-(keys.a?1:0);
 const moving=Math.hypot(forward,sideways);
 if(moving>.08){
  const speed=sprinting||keys.shift?12:7;
  p.position.x+=sideways/moving*speed*dt;
  p.position.z-=forward/moving*speed*dt;
  p.position.x=clamp(p.position.x,-47,47);
  p.position.z=clamp(p.position.z,-29,29);
  p.rotation.y=Math.atan2(sideways,forward);
 }
 animatePlayer(p,elapsed,moving);

 // بازیکنان هم‌تیمی
 home.forEach((mate,i)=>{
  if(i===selected)return;
  const formationPos=formation[i];
  const target=new THREE.Vector3(
   formationPos[0]+clamp(ball.position.x*.18,-9,9),
   0,
   formationPos[1]+clamp(ball.position.z*.2,-7,7)
  );
  moveToward(mate,target,3.3,dt);
 });

 // بازیکن کنترل‌شده نزدیک توپ، مالکیت ساده
 const d=dist(p,ball);
 if(d<1.7 && velocity.length()<8){
  ball.position.x=p.position.x+Math.sin(p.rotation.y)*.9;
  ball.position.z=p.position.z+Math.cos(p.rotation.y)*.9;
  ball.position.y=.5;
 }else{
  // تعقیب توپ توسط رقیب
  const enemy=nearestOpponent();
  moveToward(enemy,new THREE.Vector3(ball.position.x,0,ball.position.z),4.2,dt);
  away.forEach((op,i)=>{
   if(op===enemy)return;
   const homePos=formation[i];
   moveToward(op,new THREE.Vector3(-homePos[0]+ball.position.x*.12,0,-homePos[1]),2.4,dt);
  });
 }

 // فیزیک توپ
 velocity.y-=19*dt;
 ball.position.addScaledVector(velocity,dt);
 if(ball.position.y<.48){ball.position.y=.48;velocity.y*=-.42;if(Math.abs(velocity.y)<1)velocity.y=0;}
 velocity.multiplyScalar(Math.pow(.986,dt*60));
 if(Math.abs(ball.position.z)>31){ball.position.z=clamp(ball.position.z,-31,31);velocity.z*=-.65;}
 if(Math.abs(ball.position.x)>49 && Math.abs(ball.position.z)>9){ball.position.x=clamp(ball.position.x,-49,49);velocity.x*=-.65;}
 ball.rotation.x+=velocity.z*dt;
 ball.rotation.z-=velocity.x*dt;
 goalCheck();

 // دوربین تعقیب مسابقه
 const desired=new THREE.Vector3(p.position.x-5,18,p.position.z+25);
 camera.position.lerp(desired,.045);
 camera.lookAt(p.position.x+3,0,p.position.z);
}

// رندر
function loop(now){
 requestAnimationFrame(loop);
 const dt=Math.min((now-last)/1000,.04);last=now;
 update(dt);
 renderer.render(scene,camera);
}
requestAnimationFrame(loop);
