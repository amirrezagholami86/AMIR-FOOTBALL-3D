<script type="module">
import * as THREE from 'three';

/* =====================================
 AMIR FOOTBALL 3D
 VERSION 4.0.0
 AMIRREZA GHOLAMI
 ===================================== */

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bbbd0);
scene.fog=new THREE.Fog(0x9bbbd0,100,190);

const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,.1,300);
camera.position.set(0,62,73);
camera.lookAt(0,0,0);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:"high-performance"});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
document.body.appendChild(renderer.domElement);

const hemi=new THREE.HemisphereLight(0xe4f4ff,0x30462b,2.2);
scene.add(hemi);

const sun=new THREE.DirectionalLight(0xfff1d6,2.6);
sun.position.set(-30,50,25);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left=-65;
sun.shadow.camera.right=65;
sun.shadow.camera.top=55;
sun.shadow.camera.bottom=-55;
scene.add(sun);

const mat=(c,r=.8,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const white=mat(0xffffff);
const blue=mat(0x0879e8,.55);
const red=mat(0xd52c38,.55);
const black=mat(0x111820);
const skin=mat(0xb77c59);
const greenA=mat(0x267a3c);
const greenB=mat(0x318b43);

function box(w,h,d,m,x,y,z,parent=scene){
 const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);
 o.position.set(x,y,z);
 o.castShadow=true;
 o.receiveShadow=true;
 parent.add(o);
 return o;
}

function groundLine(x1,z1,x2,z2){
 const dx=x2-x1,dz=z2-z1;
 const o=new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(dx,dz),.045,.12),white);
 o.position.set((x1+x2)/2,.06,(z1+z2)/2);
 o.rotation.y=-Math.atan2(dz,dx);
 scene.add(o);
}

function rect(x,z,w,d){
 groundLine(x-w/2,z-d/2,x+w/2,z-d/2);
 groundLine(x-w/2,z+d/2,x+w/2,z+d/2);
 groundLine(x-w/2,z-d/2,x-w/2,z+d/2);
 groundLine(x+w/2,z-d/2,x+w/2,z+d/2);
}

/* زمین */

for(let i=0;i<14;i++){
 const grass=new THREE.Mesh(
  new THREE.PlaneGeometry(8,68),
  i%2?greenA:greenB
 );
 grass.rotation.x=-Math.PI/2;
 grass.position.set(-52+i*8,0,0);
 grass.receiveShadow=true;
 scene.add(grass);
}

box(115,.5,85,mat(0x183a2b),0,-.48,0);

groundLine(-48,-32,48,-32);
groundLine(-48,32,48,32);
groundLine(-48,-32,-48,32);
groundLine(48,-32,48,32);
groundLine(0,-32,0,32);

const centerCircle=new THREE.Mesh(
 new THREE.RingGeometry(9.9,10.06,80),white
);
centerCircle.rotation.x=-Math.PI/2;
centerCircle.position.y=.07;
scene.add(centerCircle);

const centerSpot=new THREE.Mesh(new THREE.CircleGeometry(.2,20),white);
centerSpot.rotation.x=-Math.PI/2;
centerSpot.position.y=.08;
scene.add(centerSpot);

rect(-38,0,20,42);
rect(38,0,20,42);
rect(-44,0,6,18);
rect(44,0,6,18);

/* ورزشگاه */

box(140,4,9,mat(0x172b3b),0,3,-47);
box(140,4,9,mat(0x172b3b),0,3,47);
box(9,4,90,mat(0x172b3b),-68,3,0);
box(9,4,90,mat(0x172b3b),68,3,0);

for(let tier=0;tier<4;tier++){
 const sm=mat([0x163b5a,0x174f70,0x18334e,0x263e55][tier]);
 const y=5+tier*2.1;
 for(const z of [-40,40]){
  const s=box(130,1.8,13,sm,0,y,z);
  s.rotation.x=z<0?-.12:.12;
 }
 for(const x of [-62,62]){
  const s=box(13,1.8,75,sm,x,y,0);
  s.rotation.z=x<0?.12:-.12;
 }
}

/* تماشاگران */

const crowdColors=[0xe8e9e7,0x1d85c5,0xd53c42,0xe5b83f,0x39a66a];
const crowdGeo=new THREE.BoxGeometry(.4,.75,.32);

for(let side=0;side<4;side++){
 for(let c=0;c<crowdColors.length;c++){
  const count=side<2?180:100;
  const inst=new THREE.InstancedMesh(crowdGeo,mat(crowdColors[c]),count);
  const dummy=new THREE.Object3D();

  for(let i=0;i<count;i++){
   const a=i/count;
   let x,z;
   if(side===0){x=-60+a*120;z=-43+Math.random()*5}
   if(side===1){x=-60+a*120;z=38+Math.random()*5}
   if(side===2){x=-64+Math.random()*5;z=-35+a*70}
   if(side===3){x=59+Math.random()*5;z=-35+a*70}

   dummy.position.set(x,7+Math.random()*7,z);
   dummy.rotation.y=Math.random()*6.28;
   dummy.scale.setScalar(.7+Math.random()*.5);
   dummy.updateMatrix();
   inst.setMatrixAt(i,dummy.matrix);
  }
  scene.add(inst);
 }
}

/* تابلوهای تبلیغاتی */

const ads=[0x04a9e7,0xe5b52c,0xd93149,0x1eaa77].map(c=>mat(c));
for(let i=0;i<16;i++){
 const x=-43+i*5.7;
 box(5.4,1.3,.45,ads[i%4],x,.9,-34.2);
 box(5.4,1.3,.45,ads[(i+1)%4],x,.9,34.2);
}

/* دروازه ها */

function makeGoal(x,dir){
 const g=new THREE.Group();
 scene.add(g);
 const postMat=mat(0xffffff,.25,.3);

 box(.38,4,.38,postMat,x,2,-9);
 box(.38,4,.38,postMat,x,2,9);
 box(.38,.38,18,postMat,x,4,0);

 const net=new THREE.Mesh(
  new THREE.BoxGeometry(5,4,18,8,6,12),
  new THREE.MeshBasicMaterial({
   color:0xffffff,wireframe:true,transparent:true,opacity:.28
  })
 );
 net.position.set(x+dir*2.5,2,0);
 scene.add(net);
}
makeGoal(-50,-1);
makeGoal(50,1);

/* نورافکن */

for(const x of [-57,57]){
 for(const z of [-39,39]){
  box(.5,24,.5,mat(0x657786,.4,.7),x,12,z);
  box(5,1,.8,mat(0xe4f2ff,.25),x,24,z);

  const light=new THREE.PointLight(0xe4f2ff,35,80);
  light.position.set(x,23,z);
  scene.add(light);
 }
}

/* بازیکنان */

const playerGeo={
 torso:new THREE.CapsuleGeometry(.53,.9,5,10),
 head:new THREE.SphereGeometry(.34,16,14),
 limb:new THREE.CapsuleGeometry(.15,.5,4,8),
 boot:new THREE.BoxGeometry(.25,.16,.4)
};

function makePlayer(team,x,z,keeper=false){
 const root=new THREE.Group();
 scene.add(root);
 root.position.set(x,0,z);

 const shirt=team===0?blue:red;
 const shorts=team===0?mat(0x102d59):mat(0xe8e8e8);
 const socks=team===0?blue:white;

 const body=new THREE.Mesh(playerGeo.torso,shirt);
 body.position.y=1.48;
 body.castShadow=true;
 root.add(body);

 const head=new THREE.Mesh(playerGeo.head,skin);
 head.position.y=2.43;
 head.castShadow=true;
 root.add(head);

 const hair=new THREE.Mesh(
  new THREE.SphereGeometry(.35,12,10),black
 );
 hair.scale.y=.45;
 hair.position.y=2.65;
 root.add(hair);

 box(.8,.35,.55,shorts,0,.95,0,root);

 const limbs=[];
 for(const side of [-1,1]){
  const leg=new THREE.Group();
  leg.position.set(side*.25,1,0);
  root.add(leg);

  const upper=new THREE.Mesh(playerGeo.limb,shorts);
  upper.position.y=-.22;
  leg.add(upper);

  const lower=new THREE.Group();
  lower.position.y=-.5;
  leg.add(lower);

  const shin=new THREE.Mesh(playerGeo.limb,socks);
  shin.position.y=-.27;
  lower.add(shin);

  const boot=new THREE.Mesh(playerGeo.boot,black);
  boot.position.set(0,-.55,.12);
  lower.add(boot);

  limbs.push({upper:leg,lower});

  const arm=new THREE.Group();
  arm.position.set(side*.6,1.8,0);
  root.add(arm);

  const armMesh=new THREE.Mesh(playerGeo.limb,shirt);
  armMesh.position.y=-.32;
  arm.add(armMesh);
 }

 root.userData={team,limbs,keeper};
 return root;
}

const formation=[
 [-35,0],[-25,-22],[-25,-8],[-25,8],[-25,22],
 [-8,-23],[-8,-8],[-8,8],[-8,23],
 [12,-10],[12,10]
];

const home=[],away=[];
for(let i=0;i<11;i++){
 const [x,z]=formation[i];
 home.push(makePlayer(0,x,z,i===0));
 away.push(makePlayer(1,-x,-z,i===0));
}

home[0].position.set(-45,0,0);
away[0].position.set(45,0,0);

/* توپ حرفه‌ای و کاملاً قابل مشاهده */

const ball=new THREE.Group();
scene.add(ball);

const ballMaterial=new THREE.MeshStandardMaterial({
 color:0xffffff,
 roughness:.3,
 metalness:.02
});

const ballSphere=new THREE.Mesh(
 new THREE.SphereGeometry(.58,32,24),
 ballMaterial
);
ballSphere.castShadow=true;
ballSphere.receiveShadow=true;
ball.add(ballSphere);

const patchMat=mat(0x111111,.55);
const patchGeo=new THREE.CircleGeometry(.17,6);

for(let i=0;i<5;i++){
 const patch=new THREE.Mesh(patchGeo,patchMat);
 const angle=i*Math.PI*2/5;
 patch.position.set(Math.cos(angle)*.25,Math.sin(angle)*.25,.51);
 ball.add(patch);
}

const seam=new THREE.Mesh(
 new THREE.TorusGeometry(.39,.012,5,40),
 black
);
ball.add(seam);

ball.position.set(0,.65,0);
ball.visible=true;

/* سایه توپ */

const ballShadow=new THREE.Mesh(
 new THREE.CircleGeometry(.7,24),
 new THREE.MeshBasicMaterial({color:0x06110a,transparent:true,opacity:.35})
);
ballShadow.rotation.x=-Math.PI/2;
ballShadow.position.y=.025;
scene.add(ballShadow);

/* وضعیت بازی */

let velocity=new THREE.Vector3();
let selected=9;
let score1=0,score2=0;
let elapsed=0;
let playing=false,paused=false;
let sprinting=false;
let last=performance.now();
let stick={x:0,y:0};
let possession=0;
let possessionTime=0;
let matchDuration=180;
let goalLock=false;

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const dist=(a,b)=>a.position.distanceTo(b.position);
const active=()=>home[selected];

function setStatus(t){$('status').textContent=t}

/* کنترل جوی استیک */

const stickEl=$('stick');
const knob=$('knob');

function moveStick(e){
 const r=stickEl.getBoundingClientRect();
 const dx=e.clientX-(r.left+r.width/2);
 const dy=e.clientY-(r.top+r.height/2);
 const len=Math.hypot(dx,dy);
 const k=Math.min(1,42/(len||1));
 stick.x=dx*k/42;
 stick.y=dy*k/42;
 knob.style.transform=`translate(${stick.x*42}px,${stick.y*42}px)`;
}

function resetStick(){
 stick={x:0,y:0};
 knob.style.transform='translate(0,0)';
}

stickEl.addEventListener('pointerdown',e=>{
 stickEl.setPointerCapture(e.pointerId);
 moveStick(e);
});
stickEl.addEventListener('pointermove',e=>{
 if(e.buttons)moveStick(e);
});
stickEl.addEventListener('pointerup',resetStick);
stickEl.addEventListener('pointercancel',resetStick);

$('sprint').addEventListener('pointerdown',()=>sprinting=true);
$('sprint').addEventListener('pointerup',()=>sprinting=false);
$('sprint').addEventListener('pointercancel',()=>sprinting=false);
$('sprint').addEventListener('pointerleave',()=>sprinting=false);

/* مالکیت توپ */

function playerHasBall(p){
 return possession===0 && dist(p,ball)<2.5;
}

function closestHome(){
 return home.reduce((a,b)=>dist(a,ball)<dist(b,ball)?a:b);
}

function nearestOpponent(){
 return away.reduce((a,b)=>dist(a,ball)<dist(b,ball)?a:b);
}

function attachBall(p){
 const direction=new THREE.Vector3(
  Math.sin(p.rotation.y),0,Math.cos(p.rotation.y)
 );
 ball.position.copy(p.position).addScaledVector(direction,.95);
 ball.position.y=.65;
 velocity.set(0,0,0);
 ball.visible=true;
}

/* پاس */

function passBall(){
 if(!playing||paused)return;

 const p=active();
 if(dist(p,ball)>4){
  setStatus('به توپ نزدیک شو تا پاس بدهی!');
  return;
 }

 let target=null;
 let best=-Infinity;

 for(let i=0;i<home.length;i++){
  if(i===selected)continue;
  const mate=home[i];
  const forward=mate.position.x-ball.position.x;
  const distance=dist(mate,ball);
  const value=forward*1.3-distance*.35;
  if(value>best){
   best=value;
   target=mate;
  }
 }

 if(!target)return;

 const dir=target.position.clone().sub(ball.position).normalize();
 possession=-1;
 velocity.copy(dir.multiplyScalar(19));
 velocity.y=3;
 setStatus('پاس ارسال شد ⚽');
}

/* شوت */

function shootBall(){
 if(!playing||paused)return;

 const p=active();
 if(dist(p,ball)>4){
  setStatus('برای شوت به توپ نزدیک شو!');
  return;
 }

 const targetZ=clamp(-ball.position.z*.12,-3.5,3.5);
 const dir=new THREE.Vector3(1,targetZ*.035,targetZ-ball.position.z*.08);
 dir.normalize();

 possession=-1;
 velocity.copy(dir.multiplyScalar(30));
 velocity.y=7.5;
 setStatus('شوووووت! 🔥');
}

/* دریبل */

function dribble(){
 const p=active();
 if(dist(p,ball)<2.5){
  attachBall(p);
  setStatus('دریبل در اختیار توست');
 }
}

/* تعویض بازیکن */

function switchPlayer(){
 const closest=closestHome();
 selected=home.indexOf(closest);
 $('playerName').textContent=selected+1;
 setStatus('بازیکن کنترل‌شده تغییر کرد');
}

/* دکمه‌ها */

$('pass').onclick=passBall;
$('shoot').onclick=shootBall;
$('switch').onclick=switchPlayer;

$('pause').onclick=()=>{
 paused=!paused;
 $('pause').textContent=paused?'▶ ادامه':'Ⅱ توقف';
 setStatus(paused?'مسابقه متوقف شد':'مسابقه ادامه دارد');
};

$('start').onclick=()=>{
 $('menu').style.display='none';
 playing=true;
 setStatus('سوت آغاز مسابقه!');
};

/* کیبورد */

const keys={};

addEventListener('keydown',e=>{
 keys[e.key.toLowerCase()]=true;
 if(e.key===' ')shootBall();
 if(e.key.toLowerCase()==='e')passBall();
 if(e.key.toLowerCase()==='q')switchPlayer();
});

addEventListener('keyup',e=>{
 keys[e.key.toLowerCase()]=false;
});

/* انیمیشن بازیکنان */

function animatePlayer(p,t,speed){
 p.userData.limbs.forEach((l,i)=>{
  l.upper.rotation.x=Math.sin(t*11+i*Math.PI)*.65*speed;
  l.lower.rotation.x=Math.max(0,Math.sin(t*11+i*Math.PI+1))*.8*speed;
 });
}

/* حرکت هوش مصنوعی */

function moveToward(p,target,speed,dt){
 const dx=target.x-p.position.x;
 const dz=target.z-p.position.z;
 const len=Math.hypot(dx,dz);

 if(len>.3){
  p.position.x+=dx/len*speed*dt;
  p.position.z+=dz/len*speed*dt;
  p.rotation.y=Math.atan2(dx,dz);
  animatePlayer(p,elapsed,1);
 }else{
  animatePlayer(p,elapsed,0);
 }

 p.position.x=clamp(p.position.x,-47,47);
 p.position.z=clamp(p.position.z,-29,29);
}

/* دروازه‌بان */

function goalkeeperAI(team,dt){
 const keeper=team===0?home[0]:away[0];
 const targetX=team===0?-45:45;

 keeper.position.x=targetX;
 keeper.position.z=clamp(ball.position.z*.8,-7,7);
 keeper.rotation.y=team===0?Math.PI/2:-Math.PI/2;

 if(dist(keeper,ball)<2.2 && ball.position.y<3){
  velocity.multiplyScalar(.15);
  velocity.x=team===0?7:-7;
  velocity.z=(Math.random()-.5)*8;
  velocity.y=2;
  possession=-1;
  setStatus('دروازه‌بان توپ را دفع کرد!');
 }
}

/* برخورد توپ و بازیکن */

function playerBallCollision(){
 const all=[...home,...away];

 for(const p of all){
  if(dist(p,ball)<1.1 && ball.position.y<1.5 && velocity.length()<17){
   const direction=new THREE.Vector3(
    ball.position.x-p.position.x,0,
    ball.position.z-p.position.z
   ).normalize();

   if(direction.length()>.1){
    velocity.x+=direction.x*2;
    velocity.z+=direction.z*2;
   }
  }
 }
}

/* گل */

function goalCheck(){
 if(goalLock)return;

 if(Math.abs(ball.position.x)>50 &&
    Math.abs(ball.position.z)<9 &&
    ball.position.y<4.5){

  goalLock=true;

  if(ball.position.x>0)score1++;
  else score2++;

  $('s1').textContent=score1;
  $('s2').textContent=score2;

  setStatus('گــــــــل! ⚽');

  ball.position.set(0,.65,0);
  velocity.set(0,0,0);
  possession=0;

  home.forEach((p,i)=>{
   p.position.set(formation[i][0],0,formation[i][1]);
  });

  away.forEach((p,i)=>{
   p.position.set(-formation[i][0],0,-formation[i][1]);
  });

  selected=9;
  setTimeout(()=>goalLock=false,1800);
 }
}

/* زمان مسابقه */

function updateClock(){
 const total=Math.floor(elapsed);
 const minutes=Math.floor(total/60);
 const seconds=total%60;

 $('clock').textContent=
  String(minutes).padStart(2,'0')+':'+
  String(seconds).padStart(2,'0');

 if(elapsed>=matchDuration){
  paused=true;
  setStatus('پایان مسابقه!');
 }
}

/* سیستم بازی */

function update(dt){
 if(!playing||paused)return;

 elapsed+=dt;
 updateClock();

 const p=active();

 const forward=-stick.y+(keys.w?1:0)-(keys.s?1:0);
 const sideways=stick.x+(keys.d?1:0)-(keys.a?1:0);
 const moving=Math.hypot(forward,sideways);

 const speed=sprinting||keys.shift?12:7;

 if(moving>.08){
  p.position.x+=sideways/moving*speed*dt;
  p.position.z-=forward/moving*speed*dt;
  p.position.x=clamp(p.position.x,-47,47);
  p.position.z=clamp(p.position.z,-29,29);
  p.rotation.y=Math.atan2(sideways,forward);
  animatePlayer(p,elapsed,1);
 }else{
  animatePlayer(p,elapsed,0);
 }

 $('speed').textContent=moving>.08?Math.round(speed):0;

 // حرکت هم‌تیمی‌ها
 home.forEach((mate,i)=>{
  if(i===selected||i===0)return;

  const f=formation[i];
  const target=new THREE.Vector3(
   f[0]+clamp(ball.position.x*.17,-9,9),
   0,
   f[1]+clamp(ball.position.z*.2,-7,7)
  );

  moveToward(mate,target,3.5,dt);
 });

 // هوش مصنوعی تیم رقیب
 const enemy=nearestOpponent();

 if(possession===0){
  moveToward(enemy,new THREE.Vector3(ball.position.x,0,ball.position.z),4.3,dt);
 }else{
  moveToward(enemy,new THREE.Vector3(ball.position.x,0,ball.position.z),4.7,dt);
 }

 away.forEach((op,i)=>{
  if(op===enemy||i===0)return;
  const f=formation[i];
  moveToward(op,new THREE.Vector3(-f[0]+ball.position.x*.1,0,-f[1]),2.8,dt);
 });

 // دروازه‌بان‌ها
 goalkeeperAI(0,dt);
 goalkeeperAI(1,dt);

 // کنترل توپ و مالکیت
 if(possession===0){
  const carrier=closestHome();

  if(dist(carrier,ball)<2.8){
   if(carrier===p && moving>.08){
    attachBall(p);
   }else{
    attachBall(carrier);
   }
  }else{
   possession=-1;
  }
 }

 // مالکیت توپ برای رقیب
 if(possession===1){
  const carrier=nearestOpponent();

  if(dist(carrier,ball)<2.8){
   const dir=new THREE.Vector3(-1,0,0);
   ball.position.copy(carrier.position).addScaledVector(dir,.95);
   ball.position.y=.65;
  }else possession=-1;
 }

 // گرفتن توپ توسط بازیکن کاربر
 if(possession===-1 && dist(p,ball)<1.35 && ball.position.y<1.5 && velocity.length()<12){
  possession=0;
  possessionTime++;
  attachBall(p);
  $('possession').textContent='AMIR FC';
 }

 // گرفتن توپ توسط حریف
 if(possession===-1 && dist(enemy,ball)<1.2 && ball.position.y<1.5 && velocity.length()<10){
  possession=1;
  velocity.set(0,0,0);
  $('possession').textContent='RIVALS';
  setStatus('حریف صاحب توپ شد');
 }

 // فیزیک توپ
 if(possession===-1){
  velocity.y-=19*dt;
  ball.position.addScaledVector(velocity,dt);

  if(ball.position.y<.58){
   ball.position.y=.58;
   velocity.y*=-.42;
   if(Math.abs(velocity.y)<1)velocity.y=0;
  }

  velocity.multiplyScalar(Math.pow(.985,dt*60));

  if(Math.abs(ball.position.z)>31){
   ball.position.z=clamp(ball.position.z,-31,31);
   velocity.z*=-.65;
  }

  if(Math.abs(ball.position.x)>49 && Math.abs(ball.position.z)>9){
   ball.position.x=clamp(ball.position.x,-49,49);
   velocity.x*=-.65;
  }

  ball.rotation.x+=velocity.z*dt;
  ball.rotation.z-=velocity.x*dt;
 }

 // سایه توپ
 ballShadow.position.x=ball.position.x;
 ballShadow.position.z=ball.position.z;
 ballShadow.scale.setScalar(1+ball.position.y*.08);
 ballShadow.material.opacity=clamp(.4-ball.position.y*.035,.08,.4);

 playerBallCollision();
 goalCheck();

 // دوربین دنبال بازیکن با حفظ دید توپ
 const midpoint=new THREE.Vector3(
  (p.position.x+ball.position.x)*.5,
  0,
  (p.position.z+ball.position.z)*.5
 );

 const desired=new THREE.Vector3(
  midpoint.x-4,
  25,
  midpoint.z+31
 );

 camera.position.lerp(desired,1-Math.exp(-2.5*dt));
 camera.lookAt(midpoint.x,0,midpoint.z);
}

/* رندر و حلقه اصلی */

function loop(now){
 requestAnimationFrame(loop);

 const dt=Math.min((now-last)/1000,.035);
 last=now;

 update(dt);
 renderer.render(scene,camera);
}

requestAnimationFrame(loop);

/* تنظیم اندازه */

addEventListener('resize',()=>{
 camera.aspect=innerWidth/innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(innerWidth,innerHeight);
 renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
});

/* اطمینان از نمایش توپ پیش از شروع */

ball.visible=true;
ball.position.set(0,.65,0);
renderer.render(scene,camera);

</script>
</body>
</html>
